<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ゾンビタイピングの確認番号</title></head>
<body style="margin:0;padding:24px;background:#10130f;color:#ece9df;font-family:Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.7">
  <div style="max-width:480px;margin:0 auto;padding:24px;border:1px solid #696350;background:#1a1c17">
    <h1 style="margin:0 0 16px;font-size:22px;color:#edc85d">ゾンビタイピング</h1>
    <p>ログインするための確認番号です。<br>ゲームの画面に、この番号を入れてください。</p>
    <p style="margin:24px 0;padding:16px;text-align:center;background:#0c0e0b;color:#edc85d;font-size:30px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
    <p style="font-size:14px;color:#c0bdaf">番号は、ほかの人に教えないでください。<br>心当たりがなければ、このメールは無視してください。</p>
    <p style="margin:24px 0 0;font-size:12px;color:#aaa798">zombietyping.jp</p>
  </div>
</body>
</html>
