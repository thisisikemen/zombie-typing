name: Check changes
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run build:hosting-preview
        env:
          VITE_ACCOUNTS_ENABLED: "true"
